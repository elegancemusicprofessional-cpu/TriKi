<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Triki - Cargando</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0b0614; font-family:'Inter',sans-serif; }

  /* ===== PANTALLA DE CARGA ===== */
  #splash {
    position:fixed; inset:0; z-index:100;
    /* AQUÍ SE USA TU IMAGEN COMO FONDO */
    background-image:url('FondoTriki.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center;
    padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));
    transition:opacity .8s ease, visibility .8s ease;
  }
  #splash.oculto { opacity:0; visibility:hidden; }

  /* sombra suave abajo para que la barra resalte sobre la imagen */
  #splash::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(5,3,10,.85) 0%, rgba(5,3,10,.35) 22%, transparent 45%);
    pointer-events:none;
  }

  /* ===== PORCENTAJE ===== */
  #pct {
    position:relative;
    font-size:22px; font-weight:900;
    color:#fff;
    text-shadow:0 0 14px rgba(255,46,147,.9), 0 2px 4px rgba(0,0,0,.8);
    margin-bottom:10px;
    letter-spacing:1px;
  }

  /* ===== BARRA DE CARGA TRICOLOR ===== */
  .barra {
    position:relative;
    width:100%; max-width:340px; height:16px;
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.35);
    border-radius:100px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.6), inset 0 2px 6px rgba(0,0,0,.4);
  }
  .barra .fill {
    height:100%; width:0%;
    border-radius:100px;
    background:linear-gradient(90deg,#ff2e93,#ffd21f,#3dff7c,#28e0ff,#b04dff,#ff2e93);
    background-size:300% 100%;
    animation:moverColor 2.2s linear infinite;
    box-shadow:0 0 16px rgba(255,255,255,.7);
    transition:width .25s ease;
  }
  @keyframes moverColor { to { background-position:300% 0; } }

  /* ===== TEXTO CARGANDO ===== */
  #txt {
    position:relative;
    margin-top:12px;
    font-size:13px; font-weight:700;
    color:rgba(255,255,255,.9);
    letter-spacing:2px;
    text-shadow:0 0 10px rgba(40,224,255,.8), 0 2px 3px rgba(0,0,0,.8);
    animation:parpadeo 1.4s ease-in-out infinite;
  }
  @keyframes parpadeo { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* ===== PANTALLA "APP LISTA" (solo para demostrar el desvanecido) ===== */
  #app {
    position:fixed; inset:0;
    display:grid; place-items:center;
    background:radial-gradient(circle at 50% 30%, #241436, #0b0614);
    color:#fff; font-size:20px; font-weight:900; text-align:center;
    opacity:0; transition:opacity .8s ease;
  }
  #app.visible { opacity:1; }
</style>
</head>
<body>

  <!-- Pantalla que aparece al terminar (demo) -->
  <div id="app">✅ Triki listo<br><small style="font-weight:600;font-size:13px;opacity:.7">(aquí entrará la app real)</small></div>

  <!-- PANTALLA DE CARGA con tu imagen de fondo -->
  <div id="splash">
    <div id="pct">0%</div>
    <div class="barra"><div class="fill" id="fill"></div></div>
    <div id="txt">CARGANDO TRIKI...</div>
  </div>

<script>
  // Simula el progreso de carga (0 a 100)
  let progreso = 0;
  const fill = document.getElementById('fill');
  const pct  = document.getElementById('pct');
  const txt  = document.getElementById('txt');

  const intervalo = setInterval(() => {
    // sube de a poco, con saltos irregulares para que se vea real
    progreso += Math.random() * 7 + 2;
    if (progreso >= 100) progreso = 100;

    fill.style.width = progreso + '%';
    pct.textContent  = Math.floor(progreso) + '%';

    if (progreso === 100) {
      clearInterval(intervalo);
      txt.textContent = '¡LISTO!';
      // al terminar, la pantalla se desvanece y entra la app
      setTimeout(() => {
        document.getElementById('splash').classList.add('oculto');
        document.getElementById('app').classList.add('visible');
      }, 600);
    }
  }, 120);
</script>

</body>
</html>
