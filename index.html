<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriKi - Multimedia Rewards Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: #161a26;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .balance-badge {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hero-card h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .hero-card p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background-color 0.2s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        footer {
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">TriKi</div>
        <div class="balance-badge">0 EGC</div>
    </header>

    <main>
        <div class="hero-card">
            <h1>Bienvenido a TriKi</h1>
            <p>Tu centro multimedia de música, videos y recompensas. Disfruta de contenido exclusivo mientras obtienes beneficios reales.</p>
            <button class="action-btn" onclick="alert('Plataforma en mantenimiento de actualización.')">Cargar Reproductor</button>
        </div>
    </main>

    <footer>
        &copy; 2026 TriKi Media. Powered by Elegance.
    </footer>

    <script>
        // Inicialización de Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
